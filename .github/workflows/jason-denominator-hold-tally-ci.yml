name: JASON Denominator HOLD Tally CI

on:
  pull_request:
    paths:
      - "scripts/jason_hold_tally.py"
      - "tests/test_jason_hold_tally.py"
      - "audit/JASON_HOLD_EVIDENCE_SAMPLE_V0_1.json"
      - ".github/workflows/jason-denominator-hold-tally-ci.yml"
  push:
    branches:
      - repair/jason-denominator-hold-tally-20261103
    paths:
      - "scripts/jason_hold_tally.py"
      - "tests/test_jason_hold_tally.py"
      - "audit/JASON_HOLD_EVIDENCE_SAMPLE_V0_1.json"
      - ".github/workflows/jason-denominator-hold-tally-ci.yml"

permissions:
  contents: read

jobs:
  scoped-audit-regression:
    name: Bounded 14-case replay (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out precise triggering source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run eight JASON denominator tests
        run: python -m unittest discover -s tests -p test_jason_hold_tally.py -v

      - name: Print bounded source-linked tally
        run: python scripts/jason_hold_tally.py audit/JASON_HOLD_EVIDENCE_SAMPLE_V0_1.json
