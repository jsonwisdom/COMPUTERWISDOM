# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Exclude unreviewed EAS receipt-registry project from Pages
        # Mainnet transaction tooling must never auto-publish on merge.
        run: rm -rf projects/eas/base-receipt-registry-v0-1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
          name: github-pages-${{ github.run_attempt }}
      - name: Verify artifact visibility
        shell: bash
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" --paginate --jq '.artifacts[] | select(.expired == false) | .id' | awk 'END {print NR}'); then
              if [[ "$count" == 1 ]]; then
                exit 0
              elif [[ "$count" -gt 1 ]]; then
                echo "::error::Multiple matching Pages artifacts"
                exit 1
              fi
            fi
            if [[ "$attempt" -lt 6 ]]; then sleep 10; fi
          done
          echo "::error::Pages artifact not uniquely visible within retry budget"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
