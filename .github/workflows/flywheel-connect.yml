name: Flywheel Wallet Connect

on:
  pull_request:
    paths:
      - "flywheel-connect/**"
      - ".github/workflows/flywheel-connect.yml"
  push:
    branches: ["master"]
    paths:
      - "flywheel-connect/**"
      - ".github/workflows/flywheel-connect.yml"

permissions:
  contents: read

jobs:
  wallet-connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned offline-test EIP-712 verifier (synthetic keys only)
        working-directory: flywheel-connect
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund ethers@6.17.0
      - name: Test Coinbase Base switch, Base-only EIP-712 domain-bound signature, and negative cases
        run: node --test flywheel-connect/connect.test.mjs
