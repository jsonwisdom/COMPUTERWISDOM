name: Flywheel Wallet Connect

on:
  pull_request:
    paths:
      - "flywheel-connect/**"
      - "services/confucius-compute-wisdom/base-batches/**"
      - ".github/workflows/flywheel-connect.yml"
  push:
    branches: ["master"]
    paths:
      - "flywheel-connect/**"
      - ".github/workflows/flywheel-connect.yml"

permissions:
  contents: read

jobs:
  wallet-connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned offline-test EIP-712 verifier (synthetic keys only)
        working-directory: flywheel-connect
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund ethers@6.17.0
      - name: Test Coinbase Base switch, Base-only EIP-712 domain-bound signature, and negative cases
        run: node --test flywheel-connect/connect.test.mjs

  base-batch-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned offline EIP-712 batch verifier
        working-directory: services/confucius-compute-wisdom/base-batches
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Test exact Base 8453 batch proof mathematics, rejection and Merkle behavior
        run: node --test services/confucius-compute-wisdom/base-batches/verify-base-signatures.test.mjs
      - name: REPLAY 007 actual EIP712 signatures into durable SQLite nonce ledger
        run: node --test services/confucius-compute-wisdom/base-batches/replay-ledger.crypto.integration.test.mjs

  acceptance-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned EIP-712 witness verifier (synthetic test keys only)
        working-directory: services/confucius-compute-wisdom/base-batches
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: REPLAY 007 independent acceptance witness, durable nonce, orphan rejection
        run: node --test services/confucius-compute-wisdom/base-batches/acceptance-witness.test.mjs

  encrypted-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned ethers for test-only independent export signatures
        working-directory: services/confucius-compute-wisdom/base-batches
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: REPLAY 007 encrypted recipient-only export, scope and independent witness
        run: node --test services/confucius-compute-wisdom/base-batches/encrypted-export.test.mjs
