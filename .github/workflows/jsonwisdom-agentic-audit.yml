name: JSONWisdom Agentic Repository Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: jsonwisdom-agentic-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository agents
        env:
          GITHUB_TOKEN: ${{ secrets.JSONWISDOM_REPO_AUDIT_TOKEN || github.token }}
          GITHUB_OWNER: jsonwisdom
        run: python knowledge-management/agents/repository_auditor.py

      - name: Validate generated JSON
        run: |
          find knowledge-management/generated -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null

      - name: Commit changed audit state
        run: |
          if git diff --quiet -- knowledge-management/generated; then
            echo "No audit-state change."
            exit 0
          fi
          git config user.name "jsonwisdom-audit-agent"
          git config user.email "actions@users.noreply.github.com"
          git add knowledge-management/generated
          git commit -m "audit: refresh repository intelligence"
          git push

      - name: Upload machine-readable audit
        uses: actions/upload-artifact@v4
        with:
          name: jsonwisdom-repository-audit
          path: knowledge-management/generated
