name: wallet-shelf-policy
on:
  push:
    branches:
      - zora-flywheel-reboot-v0-3
    paths:
      - "wallets/zora-flywheel/policy/**"
      - ".github/workflows/wallet-shelf-policy.yml"
  pull_request:
  workflow_dispatch:
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run shelf policy tests
        working-directory: wallets/zora-flywheel/policy
        run: python -m unittest test_abac_policy.py test_pep.py -v
