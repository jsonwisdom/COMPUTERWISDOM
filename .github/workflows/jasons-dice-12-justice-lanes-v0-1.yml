name: Jason's Dice 12 Justice Lanes v0.1

on:
  pull_request:
    paths:
      - 'fixtures/jaywisdom/fraud_ledger/JASONS_DICE_12_JUSTICE_LANES_V0_1.json'
      - 'tools/verify_jasons_dice_12_justice_lanes_v0_1.py'
      - '.github/workflows/jasons-dice-12-justice-lanes-v0-1.yml'
  push:
    branches:
      - 'agent/fraud-ledger-jasons-dice-game-v0-1'
    paths:
      - 'fixtures/jaywisdom/fraud_ledger/JASONS_DICE_12_JUSTICE_LANES_V0_1.json'
      - 'tools/verify_jasons_dice_12_justice_lanes_v0_1.py'
      - '.github/workflows/jasons-dice-12-justice-lanes-v0-1.yml'

permissions:
  contents: read

jobs:
  verify-precommitted-lanes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Verify 36 outcomes map evenly to 12 lanes
        run: python tools/verify_jasons_dice_12_justice_lanes_v0_1.py
