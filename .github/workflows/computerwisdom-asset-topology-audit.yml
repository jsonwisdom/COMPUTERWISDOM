name: COMPUTERWISDOM Asset Topology Audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/computerwisdom-asset-topology-v0-1
    paths:
      - 'COMPUTERWISDOM_ASSET_*.md'
      - 'executables/**'
      - 'fixtures/**'
      - 'instruments/**'
      - 'proofs/**'
      - 'whitepapers/**'
      - 'tests/test_asset_*'
      - 'tests/test_crisscross_*'
      - '.github/workflows/computerwisdom-asset-topology-audit.yml'
  pull_request:
    paths:
      - 'COMPUTERWISDOM_ASSET_*.md'
      - 'executables/**'
      - 'fixtures/**'
      - 'instruments/**'
      - 'proofs/**'
      - 'whitepapers/**'
      - 'tests/test_asset_*'
      - 'tests/test_crisscross_*'
      - '.github/workflows/computerwisdom-asset-topology-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run topology gates
        run: |
          python -m pytest -q \
            tests/test_asset_inventory_v0_1.py \
            tests/test_asset_inventory_v0_2.py \
            tests/test_asset_inventory_v0_3.py \
            tests/test_crisscross_auditor_v0_1.py \
            tests/test_asset_migration_plan_v0_1.py \
            tests/test_asset_migration_plan_v0_2.py
      - name: Build transparent audit outputs
        run: |
          mkdir -p audit-output
          python executables/asset_inventory_v0_3.py --root . > audit-output/asset-inventory.json
          python executables/asset_migration_plan_v0_2.py audit-output/asset-inventory.json --repo-root . > audit-output/asset-migration-plan.json
      - name: Assert fail-closed boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inventory=json.loads(Path('audit-output/asset-inventory.json').read_text())
          plan=json.loads(Path('audit-output/asset-migration-plan.json').read_text())
          assert inventory['schema']=='computerwisdom.asset_inventory.v0.3'
          assert inventory['classification_model']=='ORTHOGONAL_ARTIFACT_CLASS_AND_CAPABILITY_ROLE'
          assert inventory['classification_requires_review'] is True
          assert inventory['moves_performed'] is False
          assert inventory['authority_created'] is False
          assert plan['schema']=='computerwisdom.asset_migration_plan.v0.2'
          assert plan['moves_performed'] is False
          assert plan['authority_created'] is False
          assert all(item['move_authorized'] is False for item in plan['plan'])
          assert all(not (item['artifact_classes']==['executables'] and 'instrument' in item['capability_roles'] and item['state']=='HOLD_MULTI_ARTIFACT_CLASS') for item in plan['plan'])
          print('TRANSPARENT_FAIL_CLOSED_BOUNDARY=PASS')
          PY
      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: computerwisdom-asset-topology-audit
          path: audit-output/
          if-no-files-found: error
