name: JOSHUA Owner Authority CI

on:
  pull_request:
    paths:
      - 'apps/joshua-war-room/**'
      - '.github/workflows/joshua-owner-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-and-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test session authority and deterministic replay
        working-directory: apps/joshua-war-room
        run: node --test test/*.test.mjs
