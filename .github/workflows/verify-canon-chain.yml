name: Verify Canon Chain Receipt

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-canon-chain:
    name: Run canon-chain replay verifier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install TypeScript compiler
        run: npm install --no-save typescript @types/node

      - name: Compile canon-chain verifier
        run: |
          rm -rf .tmp-verifier
          npx tsc scripts/verify_canon_chain_receipt_001.ts \
            --module commonjs \
            --moduleResolution node \
            --target es2022 \
            --types node \
            --skipLibCheck \
            --outDir .tmp-verifier
          test -s .tmp-verifier/verify_canon_chain_receipt_001.js

      - name: Run canon-chain verifier
        shell: bash
        run: |
          set -uo pipefail

          verifier_status=0
          node .tmp-verifier/verify_canon_chain_receipt_001.js > verifier-result.json || verifier_status=$?

          if [[ ! -s verifier-result.json ]]; then
            printf '%s\n' '{"receipt":"receipts/continuity/CANON_CHAIN_RECEIPT_001.json","verification":"FAIL","checked_files":0,"computed_hashes":{},"hash_mismatches":[],"errors":["EMPTY_VERIFIER_OUTPUT"],"order_valid":false,"scope_valid":false,"anchor_status_valid":false}' > verifier-result.json
            verifier_status=1
          fi

          node -e '
            const fs = require("node:fs");
            const path = "verifier-result.json";
            const value = JSON.parse(fs.readFileSync(path, "utf8"));
            const required = ["receipt", "verification", "checked_files", "computed_hashes", "hash_mismatches", "errors", "order_valid", "scope_valid", "anchor_status_valid"];
            const missing = required.filter((key) => !(key in value));
            if (missing.length) throw new Error(`Missing verifier fields: ${missing.join(",")}`);
            if (!["PASS", "FAIL"].includes(value.verification)) throw new Error("Invalid verification outcome");
          ' || verifier_status=1

          cat verifier-result.json
          exit "$verifier_status"

      - name: Upload verifier result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canon-chain-verifier-result
          path: verifier-result.json
          if-no-files-found: error
          retention-days: 90
