name: Congressional Accountability Membrane v0.1

on:
  pull_request:
    paths:
      - 'schemas/jaywisdom/congressional_accountability_membrane.v0_1.schema.json'
      - 'fixtures/jaywisdom/fraud_ledger/CONGRESSIONAL_ACCOUNTABILITY_MEMBRANE_TEST_VECTORS_V0_1.json'
      - 'fixtures/jaywisdom/fraud_ledger/JOHN_JAY_CONSTITUTION_REVERSE_REPLAY_V0_1.json'
      - 'tools/verify_congressional_accountability_membrane_v0_1.py'
      - 'agents/congressional_accountability/agent_contract.json'
      - '.github/workflows/congressional-accountability-membrane-v0-1.yml'
  push:
    branches:
      - 'agent/congressional-accountability-membrane-v0-1'

permissions:
  contents: read

jobs:
  ci-congressional-membrane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Replay congressional semantic boundaries
        run: python tools/verify_congressional_accountability_membrane_v0_1.py --self-test
