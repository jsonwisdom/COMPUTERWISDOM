name: CI-FIRST Parent/Child Oversight
on:
  pull_request:
    paths:
      - "governance/children/**"
      - ".github/workflows/ci-first-parent-oversight.yml"
  push:
    paths:
      - "governance/children/**"
      - ".github/workflows/ci-first-parent-oversight.yml"
permissions:
  contents: read
jobs:
  review-only-child-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16.0"
      - name: Test read-only family/agent parent oversight, no live dual-rail
        run: node --test governance/children/parent-oversight.test.mjs
