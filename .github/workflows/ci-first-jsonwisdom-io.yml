name: CI-FIRST JSONWisdom.IO backend
on:
  push:
    paths:
      - "workers/jsonwisdom-io/**"
      - "scripts/audit/ci-first-jsonwisdom-io*"
      - ".github/workflows/ci-first-jsonwisdom-io.yml"
  pull_request:
    paths:
      - "workers/jsonwisdom-io/**"
      - "scripts/audit/ci-first-jsonwisdom-io*"
      - ".github/workflows/ci-first-jsonwisdom-io.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check Worker syntax
        run: |
          node --check workers/jsonwisdom-io/proof-origin.mjs
          node --check workers/jsonwisdom-io/supreme-origin.mjs
          node --check workers/jsonwisdom-io/proof-backend.mjs
          node --check workers/jsonwisdom-io/supreme-backend.mjs
      - name: Verify copy digests, namespace separation and HTTP behavior
        run: node --test scripts/audit/ci-first-jsonwisdom-io.test.mjs
  live-routing-proof:
    if: github.event_name == 'workflow_dispatch'
    needs: offline-source-and-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Live custom-domain and identity gate (read-only, fail closed)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: node scripts/audit/ci-first-jsonwisdom-io-live.mjs

  staging-http-and-parity:
    needs: offline-source-and-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Independent public HTTP and homepage parity (no API secrets or funds)
        run: node scripts/audit/ci-first-jsonwisdom-io-stage.mjs
