name: Workdesk Auth — Staging Preflight (NO DEPLOY)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workdesk-auth-staging
  cancel-in-progress: false
jobs:
  staging:
    # Fail closed. Requires approval plus an explicit environment variable set in GitHub.
    if: github.ref_name == 'build/workdesk-yubikey-echo-002'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workdesk/auth-worker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # No secrets may be consumed from a feature-branch workflow under DEPLOYMENT_SECURITY_POLICY_V1.
      - run: npm install --no-audit --no-fund
      - run: node --test src/index.test.js
      - run: npx wrangler deploy --dry-run --outdir ./staging-bundle
      # Real deployment requires a separately reviewed, protected deployment branch.
      - name: Record limits of this gate
        run: echo "Staging upload only. No custom domain, no key enrolled, no private records. Do not call this production-ready."
