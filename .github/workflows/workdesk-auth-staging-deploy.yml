name: Workdesk Auth — Manual Staging Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workdesk-auth-staging
  cancel-in-progress: false
jobs:
  staging:
    if: github.ref_name == 'build/workdesk-yubikey-echo-002'
    runs-on: ubuntu-latest
    environment: workdesk-auth-staging
    defaults:
      run:
        working-directory: workdesk/auth-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Cloudflare credentials without printing secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "HOLD: CLOUDFLARE_API_TOKEN GitHub secret missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "HOLD: CLOUDFLARE_ACCOUNT_ID GitHub secret missing"; exit 1; }
      - run: npm install --no-audit --no-fund
      - run: node --test src/index.test.js
      - run: npx wrangler deploy --dry-run --outdir ./staging-bundle
      - name: Deploy isolated Worker, no production routes
        run: npx wrangler deploy --name jsonwisdom-workdesk-auth-staging --compatibility-date 2026-10-28
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record limits of this gate
        run: echo "Staging upload only. No custom domain, no key enrolled, no private records. Do not call this production-ready."
