name: Citizen Blockchain Reverse Replay v0.1

on:
  pull_request:
    paths:
      - 'citizen/blockchain-reverse-replay/**'
      - 'citizen/boxd/**'
      - 'docs/jaytree/DUAL_ONION_AZURE_BLOCKCHAIN_AUDIT_V0_1.md'
      - '.github/workflows/citizen-blockchain-reverse-replay-v0-1.yml'
  push:
    branches:
      - 'stack/dual-onion-azure-blockchain-audit-v0-1'
    paths:
      - 'citizen/blockchain-reverse-replay/**'
      - 'citizen/boxd/**'
      - '.github/workflows/citizen-blockchain-reverse-replay-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Compile deterministic citizen ledger verifier
        run: python -m py_compile citizen/blockchain-reverse-replay/verify_citizen_blockchain_reverse_replay_v0_1.py

      - name: Verify normalized citizen ledger
        run: python citizen/blockchain-reverse-replay/verify_citizen_blockchain_reverse_replay_v0_1.py

      - name: Compile logicBoy BoxD verifier
        run: python -m py_compile citizen/boxd/verify_logicboy_boxd_reverse_replay_v0_1.py

      - name: Verify ReverseReplay is internal to BoxD
        run: python citizen/boxd/verify_logicboy_boxd_reverse_replay_v0_1.py

      - name: Preserve citizen/family membrane
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('citizen/blockchain-reverse-replay/CITIZEN_BLOCKCHAIN_REVERSE_REPLAY_LEDGER_V0_1.json')
          d = json.loads(p.read_text())
          b = d['boundaries']
          assert b['american_citizen_not_american_family'] is True
          assert b['joy_family_privacy_sealed'] is True
          assert b['authority_created'] is False
          assert d['round_06_executive_state'] == 'READY_NOT_ROLLED'
          print('CITIZEN_FAMILY_MEMBRANE=PASS')
          PY
