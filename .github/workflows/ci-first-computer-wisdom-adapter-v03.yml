name: CI-FIRST Computer Wisdom Model Adapter Gate A
on:
  push:
    paths:
      - 'computer-wisdom/ci-first-adapter-v03/**'
      - '.github/workflows/ci-first-computer-wisdom-adapter-v03.yml'
  pull_request:
    paths:
      - 'computer-wisdom/ci-first-adapter-v03/**'
      - '.github/workflows/ci-first-computer-wisdom-adapter-v03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-gate-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax check; no dependencies installed
        run: |
          for p in computer-wisdom/ci-first-adapter-v03/src/*.mjs computer-wisdom/ci-first-adapter-v03/test/*.mjs; do node --check "$p"; done
      - name: 21 negative and positive CI-FIRST adapter tests
        working-directory: computer-wisdom/ci-first-adapter-v03
        run: npm test
      - name: Emit mock-only receipt plus case-head checkpoint
        working-directory: computer-wisdom/ci-first-adapter-v03
        run: npm run demo
      - name: Preserve mock receipts as GitHub CI artifact, NOT production certification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: computer-wisdom-adapter-v03-MOCK-only
          path: computer-wisdom/ci-first-adapter-v03/ci-first-artifacts/
          if-no-files-found: error
