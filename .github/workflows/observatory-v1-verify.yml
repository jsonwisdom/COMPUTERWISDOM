name: Observatory V1 Verification

on:
  push:
    branches:
      - build/peoples-observatory-017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: observatory/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate evidence manifests
        run: python verify.py . --anchor-sha256 93a964e4dff031ee3a434cec12ac930c7d13e9381c8d3c594c803f31757891ac
