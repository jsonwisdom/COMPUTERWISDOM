name: Lapis CI

on:
  push:
    paths:
      - 'scaling-solutions/**'
      - '.github/workflows/lapis-ci.yml'
  pull_request:
    paths:
      - 'scaling-solutions/**'
      - '.github/workflows/lapis-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y jq coreutils python3
          python3 -m pip install pynacl
      - name: Verify
        run: |
          chmod +x scaling-solutions/verify.sh
          ./scaling-solutions/verify.sh
