name: wikiatom-bomb-v1-test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/wikiatom_bomb_v1.py'
      - 'tests/test_wikiatom_bomb_v1.py'
      - 'fixtures/wikiatom/**'
      - '.github/workflows/wikiatom-bomb-v1-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_wikiatom_bomb_v1.py
