name: WikiAdam Playwright + provenance verification

on:
  pull_request:
    paths:
      - "projects/wikiadam/**"
      - ".github/workflows/wikiadam-ci.yml"
  push:
    branches:
      - feature/wikiadam-playwright-provenance-v0-1
    paths:
      - "projects/wikiadam/**"
      - ".github/workflows/wikiadam-ci.yml"

permissions:
  contents: read

jobs:
  typed-provenance-logic:
    name: JASON typed graph and bounded walk (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic provenance regression
        run: python -m unittest discover -s projects/wikiadam/tests -p test_provenance.py -v
      - name: Run simulated Wikipedia navigation regression
        run: python -m unittest discover -s projects/wikiadam/tests -p test_wikipedia_first_link.py -v

  playwright-dom-fixtures:
    name: Chromium offline paragraph selector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run offline Chromium DOM tests only
        run: python -m unittest discover -s projects/wikiadam/tests -p test_browser_dom.py -v
