name: Revenue Agent Qualification Harness

on:
  push:
    paths:
      - "revenue_agent/**"
      - ".github/workflows/revenue-agent-eev-harness.yml"
  pull_request:
    paths:
      - "revenue_agent/**"
      - ".github/workflows/revenue-agent-eev-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification-contract:
    name: EEV + RePlay + Locality Matrix + Authorization + Prompt Spine v0.1 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema

      - name: Run qualification and replay harness
        run: |
          python -m pytest -q \
            revenue_agent/tests/test_score_schema.py \
            revenue_agent/tests/test_decomposition.py \
            revenue_agent/tests/test_replay_handoff.py \
            revenue_agent/tests/test_quadratic_family.py \
            revenue_agent/tests/test_locality_anomaly.py \
            revenue_agent/tests/test_locality_matrix_router.py \
            revenue_agent/tests/test_authorization_verifier.py \
            revenue_agent/tests/test_parser.py \
            revenue_agent/tests/test_prompt_digest.py \
            revenue_agent/tests/test_canonical_spine.py \
            -rX

      - name: Emit qualified membrane state
        if: success()
        run: |
          echo "## Revenue Agent Qualification Harness" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Formula: EEV_V0_1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Decomposition: DECOMPOSITION_V0_1" >> "$GITHUB_STEP_SUMMARY"
          echo "- RePlay handoff: REPLAY_HANDOFF_V0_1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Semantic validator: QUADRATIC_FAMILY_V0_2" >> "$GITHUB_STEP_SUMMARY"
          echo "- Locality anomaly: LOCALITY_ANOMALY_ENGINE_V0_1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Locality evidence: NON_AUTHORITATIVE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Locality Matrix router: LOCALITY_MATRIX_ROUTER_V0_1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prompt spine: CANONICAL_PROMPT_SPINE_V0_1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prompt spine e2e: QUALIFIED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Program mode: RESEARCH_AND_DEVELOPMENT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production execution: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- Human review: deferred" >> "$GITHUB_STEP_SUMMARY"
          echo "- Routing policy: FROZEN_AND_DIGEST_BOUND" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authorization verifier: PURE_STATELESS_V0_1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signature verification: INDETERMINATE_SIMULATION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action authorized: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- Aggregate score: INFORMATIONAL_ONLY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Threshold: \$15.00 USD" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authority: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scanner lane: UNLOCKED" >> "$GITHUB_STEP_SUMMARY"
          echo "- REAL_REVENUE: NOT_YET_PROVEN" >> "$GITHUB_STEP_SUMMARY"

      - name: Emit fail-closed membrane state
        if: failure()
        run: |
          echo "## Revenue Agent Qualification Harness" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authority: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scanner lane: LOCKED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Qualification: FAIL" >> "$GITHUB_STEP_SUMMARY"
          echo "- REAL_REVENUE: NOT_YET_PROVEN" >> "$GITHUB_STEP_SUMMARY"
